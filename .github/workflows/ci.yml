---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-core ansible-lint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r molecule/default/requirements.yml
          ansible-lint

  molecule:
    name: Molecule — WildFly cluster
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python_version: ["3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install Ansible, Molecule and Docker driver
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ansible-core>=2.16" \
            "molecule>=24.2.0" \
            "molecule-plugins[docker]>=23.5.0" \
            "ansible-lint>=24.2.0" \
            yamllint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r molecule/default/requirements.yml

      - name: Run Molecule tests
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
